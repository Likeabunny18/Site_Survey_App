name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon :shared:testDebugUnitTest assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk site-survey.apk
      - uses: actions/upload-artifact@v4
        with:
          name: site-survey-apk
          path: site-survey.apk
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest site-survey.apk \
            --title "Site Survey build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone: tap site-survey.apk below, then Install." \
            --target "$GITHUB_SHA"
